<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kamakura temples and coast route</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body{margin:0;height:100%;font:13px system-ui;color:#173d3b}body{display:flex;flex-direction:column}header{padding:12px;background:#f8f4eb}header b{display:block;margin-bottom:5px}#map{flex:1;min-height:330px}.pin{border-radius:50%;background:#245d50;border:2px solid white;color:white;display:grid;place-items:center;font-weight:bold;box-shadow:0 1px 5px #666}.temple{background:#a95831}.alt{background:#76658a}.leaflet-tooltip{font-size:11px}.key{font-size:11px;line-height:1.6}a{color:#215f67}</style></head><body><header><b>Kamakura → Hase temples → coast → Kamakura / Tokyo</b><span class="key">North is up · green = stations · rust = sights · purple = bamboo alternative<br>Dashed connectors indicate station order only, not track geometry. Use pin links for live travel directions.</span></header><div id="map" aria-label="Interactive street map"><p>Loading map… If unavailable, <a target="_blank" href="https://www.google.com/maps/search/?api=1&amp;query=Kamakura+Station">open Kamakura in Google Maps</a>.</p></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map',{scrollWheelZoom:false});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',maxZoom:19}).addTo(map);L.control.scale({imperial:false}).addTo(map);
const points=[
['1 / 8','Kamakura Station',[35.3190722,139.5504361],'','Start / finish. JR arrival from Tokyo; change to Enoden for Hase. Return here after sunset for JR to Tokyo.'],
['2','Hase Station',[35.3113889,139.5363889],'','Get off for the two temples; return here afterwards. Then ride towards Fujisawa to Kamakurakōkōmae.'],
['3','Hase-dera',[35.3125,139.5330556],'temple','About 5 minutes on foot from Hase Station. Allow 60–90 minutes.'],
['4','Great Buddha · Kōtoku-in',[35.31686,139.53572],'temple','Optional second temple. Walk from Hase-dera; return to Hase Station afterwards.'],
['5','Kamakurakōkōmae Station',[35.3066667,139.5005556],'','Photo stop. Famous crossing is a short walk east of the station. Afterwards take a Kamakura-bound train.'],
['6','Shichirigahama Station',[35.3063889,139.51],'','Walk to the nearby beach for coffee and sea views. Sunset here is an alternative to the park.'],
['7','Inamuragasaki Station',[35.3044444,139.5222222],'','Walk roughly 5–10 minutes to the coastal park. Return here for a Kamakura-bound train.'],
['7a','Inamuragasaki Park',[35.3023519,139.5254286],'temple','Park-area pin, not a specific entrance. Sunset viewpoint; walk back to Inamuragasaki Station afterwards.'],
['Alt','Hōkoku-ji',[35.32,139.5693],'alt','Separate bamboo alternative: bus/taxi from Kamakura, then return to Kamakura before taking Enoden. Not on the Enoden line.']];
const markers=[];points.forEach(([n,name,ll,cls,note])=>{const search=name==='Great Buddha · Kōtoku-in'?'Kotoku-in Kamakura':name==='Hase-dera'?'Hasedera Kamakura':name;const icon=L.divIcon({className:'pin '+cls,html:n,iconSize:[n==='1 / 8'?42:30,30]});const marker=L.marker(ll,{icon}).addTo(map).bindTooltip(name,{direction:'top',permanent:innerWidth>700,offset:[0,-10]}).bindPopup('<b>'+n+' · '+name+'</b><p>'+note+'</p><a target="_blank" rel="noreferrer" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(search)+'">Open place / directions ↗</a>');markers.push(marker);});
const rail=[[35.3190722,139.5504361],[35.3136111,139.5452778],[35.3127778,139.5416667],[35.3113889,139.5363889],[35.3091667,139.5286111],[35.3044444,139.5222222],[35.3063889,139.51],[35.3066667,139.5005556]];
L.polyline(rail,{color:'#327c68',weight:3,dashArray:'6 7',opacity:.7}).addTo(map).bindPopup('Enoden station-order connector; not a traced railway route. Outbound: towards Fujisawa. Coastal stops and return: towards Kamakura.');
const mainBounds=L.latLngBounds(points.filter(p=>p[0]!=='Alt').map(p=>p[2]));function fit(){map.invalidateSize();map.fitBounds(mainBounds,{padding:[30,45]});}new ResizeObserver(fit).observe(document.getElementById('map'));requestAnimationFrame(fit);
const control=L.control({position:'topright'});control.onAdd=()=>{const div=L.DomUtil.create('div','leaflet-bar');const btn=document.createElement('button');btn.textContent='Include bamboo alternative';btn.style.cssText='background:white;border:0;padding:9px;cursor:pointer';btn.onclick=()=>map.fitBounds(L.latLngBounds(points.map(p=>p[2])),{padding:[30,30]});div.appendChild(btn);L.DomEvent.disableClickPropagation(div);return div;};control.addTo(map);
</script></body></html>
