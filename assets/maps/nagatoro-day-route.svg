<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Chichibu to Nagatoro: the day's route</title><desc id="desc">Transfer on foot from Seibu-Chichibu to Ohanabatake, then local train to Nagatoro. Visit shrine and mountain to the west, then the shopping street and river to the east. Optional Maple Park to the south. Not to scale.</desc>
<rect width="1000" height="650" rx="16" fill="#f4eedf"/><g font-family="Arial,sans-serif" fill="#263b30"><text x="40" y="45" font-size="23" font-weight="bold">CHICHIBU → NAGATORO</text><text x="40" y="71" font-size="14">Transfer + walking circuit · schematic, not to scale · north approximately up ↑</text>
<rect x="35" y="95" width="930" height="105" rx="12" fill="#dce5d7"/><text x="60" y="128" font-size="19" font-weight="bold">Seibu-Chichibu</text><text x="60" y="156" font-size="14">Laview arrives 09:51</text><text x="265" y="145" font-size="15">→ walk 5–10 min →</text><text x="445" y="128" font-size="19" font-weight="bold">Ohanabatake</text><text x="445" y="156" font-size="14">Local train, no reservation</text><text x="685" y="145" font-size="15">→ 20–25 min + waiting →</text>
<path d="M900 175 V280 H515 V375" fill="none" stroke="#4c7760" stroke-width="5" stroke-dasharray="9 7"/><text x="615" y="268" font-size="14">Arrive Nagatoro ≈10:30</text>
<path d="M865 220 Q825 340 880 440 T865 625" fill="none" stroke="#89b8bb" stroke-width="65"/><text x="900" y="326" font-size="17" fill="#285c66" transform="rotate(90 900 326)">ARAKAWA RIVER</text>
<path d="M515 385 H290 V305 H120 V260" fill="none" stroke="#b77843" stroke-width="4"/><path d="M515 385 H800" fill="none" stroke="#b77843" stroke-width="4"/><path d="M515 400 V550 H745" fill="none" stroke="#b77843" stroke-width="3" stroke-dasharray="7 6"/>
<g fill="#fffaf0" stroke="#697b60" stroke-width="2"><rect x="40" y="220" width="210" height="65" rx="10"/><rect x="190" y="305" width="220" height="65" rx="10"/><rect x="190" y="405" width="220" height="65" rx="10"/><rect x="435" y="355" width="160" height="65" rx="10"/><rect x="700" y="365" width="150" height="65" rx="10"/><rect x="650" y="520" width="195" height="65" rx="10"/></g>
<text x="57" y="246" font-size="18" font-weight="bold">Summit + Okumiya</text><text x="57" y="268" font-size="13">Views and a short walk</text><text x="207" y="332" font-size="18" font-weight="bold">Ropeway base</text><text x="207" y="354" font-size="13">5-minute ride to summit</text><text x="207" y="432" font-size="18" font-weight="bold">Hodosan Shrine</text><text x="207" y="455" font-size="13">Then walk uphill 10–15 min</text><path d="M300 405 V370" stroke="#b77843" stroke-width="4"/><text x="450" y="382" font-size="18" font-weight="bold">Nagatoro</text><text x="450" y="405" font-size="14">Station · start / finish</text><text x="714" y="393" font-size="18" font-weight="bold">Iwadatami</text><text x="714" y="416" font-size="13">River rock terraces</text><text x="665" y="548" font-size="18" font-weight="bold">Maple Park</text><text x="665" y="571" font-size="13">Optional · add time</text>
<text x="315" y="394" font-size="12">15–20 min</text><text x="604" y="347" font-size="14">Shopping street</text><text x="604" y="369" font-size="12">5–10 min to river</text><text x="530" y="496" font-size="13">≈15 min from station</text><text x="45" y="540" font-size="17" font-weight="bold">Suggested order</text><text x="45" y="565" font-size="14">Shrine → ropeway → return past station</text><text x="45" y="588" font-size="14">→ lunch / shopping → river → station</text><text x="45" y="625" font-size="13">Return: Nagatoro → Ohanabatake → walk → Seibu-Chichibu → Laview to Ikebukuro</text></g></svg>
